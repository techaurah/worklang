<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-label="WorkLang architecture: traces are tokenised into a 69 token vocabulary, worklang-mini learns next event prediction, an eval harness scores it against baselines, and futures are sampled from prefixes">
<rect width="1240" height="690" rx="18" fill="#0B1F3A"/>
<text x="48" y="52" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#EAF6FF">WorkLang architecture</text>
<text x="48" y="80" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9DB8D2">Agent executions become a fixed token language; a small decoder-only model learns what happens next.</text>
<text x="48" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#00CEFF">ENCODE</text>
<rect x="48" y="134" width="340" height="132" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="68" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF6FF">TRACES (JSONL)</text>
<text x="68" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">schema.py validates every trace and</text>
<text x="68" y="219" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">event against fixed bucket sets.</text>
<text x="68" y="242" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Anything outside the buckets is</text>
<text x="68" y="265" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">dropped at the lossy boundary.</text>
<line x1="388" y1="200" x2="414" y2="200" stroke="#00CEFF" stroke-width="2.5"/>
<polygon points="414,194 426,200 414,206" fill="#00CEFF"/>
<rect x="424" y="134" width="380" height="132" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="444" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF6FF">TOKENIZER</text>
<text x="444" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Deterministic rules, no learned</text>
<text x="444" y="219" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">quantiser. One event = 7 tokens:</text>
<text x="444" y="242" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">family, channel, score_band,</text>
<text x="444" y="265" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">latency_band, stage, tool, outcome.</text>
<line x1="804" y1="200" x2="830" y2="200" stroke="#00CEFF" stroke-width="2.5"/>
<polygon points="830,194 842,200 830,206" fill="#00CEFF"/>
<rect x="840" y="134" width="352" height="132" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="860" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF6FF">VOCABULARY</text>
<text x="860" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">69 tokens, enumerated in vocab.py.</text>
<text x="860" y="219" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Id space reserved up to 128.</text>
<text x="860" y="242" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Trace = BOS, vertical token,</text>
<text x="860" y="265" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">event tokens, EOS. Decode is exact.</text>
<text x="48" y="308" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#00CEFF">LEARN AND MEASURE</text>
<rect x="48" y="320" width="340" height="172" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="68" y="354" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF6FF">CORPUS V0 (FROZEN)</text>
<text x="68" y="382" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">409 traces, 4,637 events, 33,686</text>
<text x="68" y="405" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">tokens. 100 percent synthetic.</text>
<text x="68" y="428" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Source A: QualBench emitter.</text>
<text x="68" y="451" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Source B: LeadPipe synthesiser.</text>
<line x1="388" y1="395" x2="414" y2="395" stroke="#00CEFF" stroke-width="2.5"/>
<polygon points="414,389 426,395 414,401" fill="#00CEFF"/>
<rect x="424" y="320" width="380" height="172" rx="12" fill="#12294D" stroke="#00CEFF" stroke-width="2"/>
<text x="444" y="354" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#00CEFF">WORKLANG-MINI</text>
<text x="444" y="382" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Decoder-only transformer, CPU.</text>
<text x="444" y="405" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">d_model 256, 6 layers, 8 heads,</text>
<text x="444" y="428" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">context 256 events. 5,246,523</text>
<text x="444" y="451" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">parameters. Family head first,</text>
<text x="444" y="474" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">then one head per attribute stream.</text>
<line x1="804" y1="395" x2="830" y2="395" stroke="#00CEFF" stroke-width="2.5"/>
<polygon points="830,389 842,395 830,401" fill="#00CEFF"/>
<rect x="840" y="320" width="352" height="172" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="860" y="354" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF6FF">EVAL HARNESS</text>
<text x="860" y="382" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Same positions for every system.</text>
<text x="860" y="405" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Baselines: majority, order-2 n-gram.</text>
<text x="860" y="428" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Family 0.8511 vs 0.7004, composite</text>
<text x="860" y="451" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">0.2537 vs 0.2059. Exception kept:</text>
<text x="860" y="474" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">outcome_class 0.8952 vs 0.9430.</text>
<line x1="614" y1="266" x2="614" y2="296" stroke="#00CEFF" stroke-width="2.5"/>
<polygon points="608,296 614,308 620,296" fill="#00CEFF"/>
<text x="48" y="512" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#00CEFF">ANSWER</text>
<rect x="48" y="524" width="556" height="142" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="68" y="558" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF6FF">FUTURES SAMPLING</text>
<text x="68" y="586" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">Give the mini a live prefix; it samples completions at</text>
<text x="68" y="609" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">temperature 1.0, up to 64 new events each. Outcome shares</text>
<text x="68" y="632" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">are counted across samples. Calibration is a measured gap:</text>
<text x="68" y="655" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">pooled total variation 0.2262, so shares are model behaviour.</text>
<line x1="604" y1="583" x2="630" y2="583" stroke="#00CEFF" stroke-width="2.5"/>
<polygon points="630,577 642,583 630,589" fill="#00CEFF"/>
<rect x="640" y="524" width="552" height="142" rx="12" fill="#12294D" stroke="#2A5A8F" stroke-width="1.5"/>
<text x="660" y="558" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#EAF6FF">FUTURES DEMO</text>
<text x="660" y="586" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">demo/index.html: a static, self-contained page. The</text>
<text x="660" y="609" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">after-hours missed lead, sampled with and without an</text>
<text x="660" y="632" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">instant automated reply. Data precomputed by</text>
<text x="660" y="655" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9DB8D2">scripts/sample_futures.py from the trained weights.</text>
</svg>